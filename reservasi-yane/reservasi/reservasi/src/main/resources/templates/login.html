<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrandReserve - Restrict Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f4f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .brand-header {
            background: linear-gradient(45deg, #3182ce, #319795);
            padding: 35px 20px;
            text-align: center;
            color: white;
        }
        .brand-logo {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .form-control {
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            padding: 12px 16px;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #3182ce, #2b6cb0);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #2b6cb0, #2c5282);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(49, 130, 206, 0.25);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-header">
        <div class="brand-logo"><i class="fa-solid fa-hotel me-2"></i>Gloria Hotel</div>
        <p class="m-0 text-white-50 small">Internal Property Management System</p>
    </div>
    
    <div class="card-body p-4 pt-5">
        <!-- Notifikasi Error Login -->
        <div th:if="${error}" class="alert alert-danger border-0 small rounded-3 d-flex align-items-center mb-4" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span th:text="${error}">Error</span>
        </div>
        
        <div th:if="${param.logout}" class="alert alert-success border-0 small rounded-3 d-flex align-items-center mb-4" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span>Anda telah berhasil keluar dari sistem.</span>
        </div>

        <form th:action="@{/login}" method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fa-regular fa-user"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="Masukkan username" required autofocus>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-login w-100 mb-2">
                Sign In<i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
